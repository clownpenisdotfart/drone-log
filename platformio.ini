; Receive-only FAA Remote ID logger.
;
;   cardputer-adv  handheld build for the M5Stack Cardputer ADV (screen + SD)
;   node           headless fixed node for a generic ESP32-S3 dev board with a
;                  microSD breakout; logs to SD and can upload to the live map
;
; Uses the pioarduino build of platform-espressif32 (Arduino core 3.x) and
; pulls libraries straight from GitHub, so a build only needs github.com.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_ldf_mode = chain

[env:cardputer-adv]
board = m5stack-stamps3
build_src_filter = +<*> -<node_main.cpp> -<uplink.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.32
    https://github.com/m5stack/M5Unified.git#0.2.25
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#v4.7.1
    https://github.com/m5stack/M5Cardputer.git#1.2.0

[env:node]
board = esp32-s3-devkitc-1
build_src_filter = +<*> -<cardputer_main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; microSD breakout wiring (SPI): SCK, MISO, MOSI, CS
    -DSD_SCK_PIN=12
    -DSD_MISO_PIN=13
    -DSD_MOSI_PIN=11
    -DSD_CS_PIN=10
